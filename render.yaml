databases:
  - name: bdvh144-postgres
    databaseName: bdvh144_db
    user: bdvh144_user
    plan: free
    region: singapore

services:
  - type: web
    name: bdvh144-manager
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bdvh144-postgres
          property: connectionString
      - key: CODE_KHOI_PRIMARY
        sync: false
      - key: CODE_KHOI_BACKUP
        sync: false
      - key: CODE_THAY_KHOA
        sync: false

